# Static export of the Next.js site (see next.config.js: output 'export').
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Long-lived caching for hashed build assets and the big static data files.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
